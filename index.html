<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Navbars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid px-0" id="boardroom">
        <div class="navbar navbar-expand-lg bg-gradient">
            <div class="container">
                <ul class="nav justify-content-start">
                    <li class="navbar-brand"><i class="bi bi-instagram"></i></li>
                </ul>
                <ul class="nav justify-content-center">
                    <img src="experience-bootstrap-navbars-board-room-logo.png" alt="Logo" width="70">
                </ul>
                <ul class="nav justify-content-end">
                    <div class="btn btn-dark">Menu</div>
                </ul>
            </div>
        </div>
     </div>

     <div>
        <div class="navbar navbar-expand-lg bg-light">
            <div class="container py-2">
                <div class="mx-auto navbar nav">
                    <img src="experience-bootstrap-navbars-morning-brew-logo.png" alt="Logo" width="200">
                </div>
            </div>
        </div>
            <div class="navbar navbar-expand-lg bg-light sticky-top">
                <div class="container">
                    <div class="mx-auto navbar-nav">
                        <div class="nav-item border-1 border-top border-dark active border-3">Home</div>
                        <div class="nav-item border-1 border-top border-dark">Order</div>
                        <div class="nav-item border-1 border-top border-dark">Online</div>
                        <div class="nav-item border-1 border-top border-dark">Menus</div>
                        <div class="nav-item border-1 border-top border-dark">Locations</div>
                        <div class="nav-item border-1 border-top border-dark">About</div>
                        <div class="nav-item border-1 border-top border-dark">Shop</div>
                        <div class="nav-item border-1 border-top border-dark">Contact</div>
                    </div>
                </div>
            </div> 
     </div>

     <div class="container-fluid px-0" style="background-color: rgb(48,73,95); color: white;">
        <div class="navbar navbar-expand-lg bg-gradient">
            <div class ="container py-3">
                <ul class="nav justify-content-start">
                    <h4 class="px-2">Lunch</h4>
                    <h4 class="px-2">Dinner</h4>
                    <h4 class="px-2">Drinks & Pupu</h4>
                </ul>
                <ul class="nav justify-content-center">
                    <img src="experience-bootstrap-navbars-buzzs-logo.png" alt="Logo" height="70">
                </ul>
                <ul class="nav justify-content-end">
                    <h4 class="px-2">About</h4>
                    <h4 class="px-2">Location</h4>
                    <h4 class="px-2">Shop <i class="bi bi-cart"></i></h4>
                </ul>
            </div>
        </div>
     </div>

     <div class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            
            <div class="nav justify-content-start" id="aloha-beer">
                <class="navbar-brand">
                    <img src="experience-bootstrap-navbars-aloha-beer-logo.png" alt="Logo" width="110">
                </class>
            </div>
            <div class="nav justify-content-center" id="aloha-beer">
                <nav-item class="nav-link">Locations & Menus</nav-item>
                <nav-item class="nav-link">Events</nav-item>
                <nav-item class="nav-link">Brewery</nav-item>
                <nav-item class="nav-link" style="color:#EDC601">Shop</nav-item>
            </div>
            <div class="nav justify-content-end" id="aloha-beer">
                <nav-item class="nav-link">Account</nav-item>
                <nav-item class="nav-link">Search <i class="bi bi-search"></i></nav-item>
                <nav-item class="nav-link">Cart <i class="bi bi-cart3"> </i></nav-item>
            </div>
        </div>
     </div>
</body>
</html>
